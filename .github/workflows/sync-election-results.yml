name: Sync 2026 SF Election Results & Deploy Dashboard

on:
  workflow_dispatch:
    inputs:
      watch_minutes:
        description: 'Poll sfelections.org every 30s for this many minutes (max 320) and publish each new report. 0 = rebuild and redeploy the whole site once.'
        default: '0'
      force:
        description: 'Publish upstream XML even if total ballots went down'
        type: boolean
        default: false
  push:
    branches:
      - main
  schedule:
    # Election Day & Night (Tue Nov 3 – Wed Nov 4, 2026 UTC): wake up every 5 minutes
    - cron: '*/5 * 3-4 11 *'
    # Canvass Period (Nov 5–26, 2026): wake up every 5 minutes during the 3:00 PM – 6:00 PM PST (23:00 – 02:00 UTC) release window, and every 15 minutes otherwise
    - cron: '*/5 0-2,23 5-26 11 *'
    - cron: '*/15 3-22 5-26 11 *'

permissions:
  contents: write

# Long watch runs get their own group so pushes and cron runs are never queued behind them.
concurrency:
  group: ${{ (github.event_name == 'workflow_dispatch' && inputs.watch_minutes != '0') && 'sf-election-watch' || 'sf-election-results-sync' }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      FORCE: ${{ inputs.force || false }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Choose sync mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          WATCH_MINUTES: ${{ inputs.watch_minutes || '0' }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            # Peak SF release windows get 9 checks x 30s (4.5 minutes between 5-minute crons):
            # - Election Night: Wed Nov 4 04:00 – 09:59 UTC (Tue 8:00 PM – Wed 1:59 AM PST)
            # - Daily canvass drop: 23:00 – 00:59 UTC (3:00 – 4:59 PM PST)
            UTC_HOUR=$(date -u +%H)
            UTC_DAY=$(date -u +%d)
            ITERATIONS=1
            if [ "$UTC_DAY" = "04" ] && [ "$UTC_HOUR" -ge 4 ] && [ "$UTC_HOUR" -le 9 ]; then
              ITERATIONS=9
            elif [ "$UTC_HOUR" = "23" ] || [ "$UTC_HOUR" = "00" ]; then
              ITERATIONS=9
            fi
            echo "mode=poll" >> "$GITHUB_OUTPUT"
            echo "iterations=$ITERATIONS" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$WATCH_MINUTES" -gt 0 ] 2>/dev/null; then
            [ "$WATCH_MINUTES" -gt 320 ] && WATCH_MINUTES=320
            echo "mode=poll" >> "$GITHUB_OUTPUT"
            echo "iterations=$((WATCH_MINUTES * 2))" >> "$GITHUB_OUTPUT"
          else
            echo "mode=build" >> "$GITHUB_OUTPUT"
          fi

      - name: Poll sfelections.org and publish new XML to gh-pages
        if: steps.mode.outputs.mode == 'poll'
        run: bash .github/scripts/sync-results.sh poll "${{ steps.mode.outputs.iterations }}"

      - name: Fetch latest valid XML for full build
        if: steps.mode.outputs.mode == 'build'
        run: bash .github/scripts/sync-results.sh prepare-build

      - name: Setup Node.js
        if: steps.mode.outputs.mode == 'build'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/frontend/dashboard/package-lock.json

      - name: Install and build frontend
        if: steps.mode.outputs.mode == 'build'
        working-directory: src/frontend/dashboard
        run: |
          npm ci
          npm run build

      - name: Deploy to gh-pages
        if: steps.mode.outputs.mode == 'build'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./src/frontend/dashboard/dist
